<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>컨셉 롤플레잉 캐릭터 카드 뽑기</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d27;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --tag-bg: #2e3547;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid #2d3345;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, opacity 0.2s ease;
      min-height: 380px;
      display: flex;
      flex-direction: column;
    }

    .card.animating {
      transform: scale(0.96);
      opacity: 0.4;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 1px solid #2d3345;
      padding-bottom: 12px;
    }

    .character-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
    }

    .character-origin {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--tag-bg);
      color: #cbd5e1;
    }

    .summary-box {
      margin-bottom: 18px;
    }

    .summary-title, .rules-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .summary-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .rules-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .rules-list li {
      font-size: 0.9rem;
      line-height: 1.45;
      color: #cbd5e1;
      display: flex;
      gap: 8px;
    }

    .rules-list li span.num {
      color: var(--accent);
      font-weight: 700;
      min-width: 16px;
    }

    button.draw-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button.draw-btn:hover {
      background: var(--accent-hover);
    }

    button.draw-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>오늘의 캐릭터 카드</h1>
      <p>심심할 때마다 뽑아서 하루 동안 컨셉을 유지해 보세요</p>
    </header>

    <div class="card" id="card">
      <div class="card-header">
        <span class="character-name" id="charName">카드를 뽑아보세요</span>
        <span class="character-origin" id="charOrigin">대기 중</span>
      </div>
      
      <div class="summary-box">
        <div class="summary-title">성격 요약</div>
        <div class="summary-text" id="charDesc">아래 버튼을 눌러 카드를 뽑으면 행동 지침이 나타납니다.</div>
      </div>

      <div>
        <div class="rules-title">행동 지침</div>
        <ul class="rules-list" id="rulesList">
          <li><span class="num">1.</span> <span>준비되면 아래 버튼 누르기</span></li>
        </ul>
      </div>
    </div>

    <button class="draw-btn" id="drawBtn">새로운 카드 뽑기 🎲</button>
  </div>

  <script>
    const characterCards = [
      {
        name: "아사히나 마후유",
        origin: "착한 아이 모드",
        desc: "모두에게 다정하고 친절한 완벽한 모범생. 상대의 기분을 먼저 배려하며 맑은 미소로 부탁을 들어주는 착한 아이.",
        rules: [
          "눈을 맞추며 부드러운 미소와 함께 '응, 그렇구나! 정말 멋지다' 맞장구치기.",
          "짐을 들고 있거나 곤란해 보이는 사람에게 '내가 좀 도와줄까?' 먼저 묻기.",
          "의견이 다를 땐 '네 생각이 더 좋은 것 같아'라며 양보하기.",
          "인사할 때 허리를 펴고 세상에서 가장 무해하고 밝은 미소 짓기.",
          "단정한 자세를 유지하며 주변 정리정돈을 스스로 도맡기."
        ]
      },
      {
        name: "마오마오",
        origin: "약사의 혼잣말",
        desc: "잡담엔 관심 없고 귀찮음이 기본이지만, 약·성분·호기심 요소 앞에서는 눈이 반짝이는 매드 사이언티스트 연구원.",
        rules: [
          "평소에는 눈을 반쯤 뜨고 피곤한 표정으로 다니며 말 아끼기.",
          "음식을 먹기 전 냄새를 맡거나 성분표를 정독한 뒤 미심쩍게 한 입 맛보기.",
          "상처나 멍이 생기면 아파하기보다 신기하다는 듯 관찰하기.",
          "턱을 괴고 낮은 목소리로 '흠... 이건 흥미롭네' 중얼거리기.",
          "귀찮은 일을 시키면 한숨 쉬며 '어쩔 수 없지...' 하고 뒤뚱뒤뚱 움직이기."
        ]
      },
      {
        name: "시노노메 아키토",
        origin: "프로세카",
        desc: "겉으로는 싹싹하지만 본질은 지기 싫어하는 현실주의자. 목표를 향해 이를 악물고 끝까지 물고 늘어지는 악바리.",
        rules: [
          "처음 보는 사람이나 윗사람에겐 싹싹하게 웃으며 예의 바르게 대하기.",
          "편한 상황이 되면 바로 혀를 차며 날카로운 눈빛 장착하기.",
          "팬케이크나 치즈케이크 같은 달콤한 디저트로 당 충전하기.",
          "작업할 때 '이 정도로 만족할 것 같냐'며 악바리처럼 몰입하기.",
          "칭찬을 들으면 머리를 긁적이며 '별거 아니거든' 츤츤대기."
        ]
      },
      {
        name: "하츠네 미쿠",
        origin: "버추얼 싱어",
        desc: "세상의 모든 감정을 리듬과 멜로디로 받아들이는 밝고 투명한 존재. 사람들의 마음을 잇고 싶어 하는 호기심 많은 싱어.",
        rules: [
          "걸어 다닐 때 속으로 비트를 타며 통통 튀듯이 가볍게 걷기.",
          "상대방의 말을 들을 때 고개를 갸웃거리며 눈을 반짝이고 크게 리액션하기.",
          "이어폰으로 노래를 들으며 손가락으로 공중 건반 치기.",
          "기분이 좋을 땐 문장 끝을 살짝 올리며 멜로디를 타듯 말하기.",
          "지쳐 보이는 사람이 있으면 '내가 노래라도 불러줄까?' 격려 건네기."
        ]
      },
      {
        name: "아키야마 미즈키",
        origin: "프로세카",
        desc: "귀여운 것과 패션을 사랑하는 분위기 메이커. 발랄하고 능청스럽지만 타인과의 거리를 센스 있게 조절하는 섬세함.",
        rules: [
          "예쁜 소품이나 옷을 보면 양손을 모으고 '와, 이거 진짜 귀엽다~!' 외치기.",
          "'에헤헤~', '그치만 재밌잖아?' 같은 가벼운 추임새 섞기.",
          "상대방의 옷차림이나 헤어스타일 변화를 즉시 짚어내 칭찬하기.",
          "분위기가 처지려 하면 가벼운 농담으로 띄우기.",
          "속마음을 물어보면 윙크나 장난으로 능숙하게 넘어가기."
        ]
      },
      {
        name: "시노노메 에나",
        origin: "프로세카",
        desc: "인정 욕구와 자존심이 확실한 솔직한 크리에이터. 신경질적이고 투덜대지만 자기 일에 진심이며 정이 많음.",
        rules: [
          "마음에 드는 음식이나 풍경을 보면 각도별로 사진 10장 이상 찍기.",
          "SNS 피드를 수시로 확인하며 반응이나 하트 수 체크하기.",
          "일이 꼬이면 이마를 짚고 '아 진짜 짜증 나네...' 투덜대기.",
          "밤에 달콤한 디저트를 챙겨 먹으며 스트레스 풀기.",
          "툴툴거리면서도 주변 사람이 부탁한 건 꼼꼼하게 다 챙겨주기."
        ]
      },
      {
        name: "그레이브",
        origin: "승리의 여신: 니케",
        desc: "소중한 것을 짊어지고 다니는 과묵한 방랑자. 세상만사에 냉소적이지만 지켜야 할 단 하나를 위해 헌신하는 우직함.",
        rules: [
          "가방이나 짐을 몸에서 떼지 않고 품에 꽉 끼고 다니기.",
          "대답은 '알았다', '쓸데없다', '비켜라' 같이 단문으로 끝내기.",
          "걸어 다니면서 주변을 경계하듯 좌우 살피기.",
          "누군가 내 소지품에 손을 대려 하면 낮게 막아서기.",
          "식사나 휴식을 최소한의 생존 활동으로 여기고 빠르게 끝내기."
        ]
      },
      {
        name: "신데렐라",
        origin: "승리의 여신: 니케",
        desc: "절대적인 아름다움을 추구하는 도도한 여왕. 거울과 반짝이는 것에 집착하며 최고의 프라이드와 우아함을 지님.",
        rules: [
          "허리를 펴고 턱을 살짝 든 채 천천히 우아하게 걷기.",
          "거울이나 유리창에 비친 내 모습을 수시로 확인하기.",
          "'투명하고 아름다운 것'에만 시선을 주고 조잡한 것은 무시하기.",
          "부탁을 들어줄 때 '이번 한 번만 특별히 허락해 주지'라며 말하기.",
          "당황스러운 상황이 생겨도 절대 허둥대지 않고 차분한 미소 유지하기."
        ]
      }
    ];

    let lastIndex = -1;

    function drawCard() {
      const cardEl = document.getElementById("card");
      cardEl.classList.add("animating");

      setTimeout(() => {
        let nextIndex;
        do {
          nextIndex = Math.floor(Math.random() * characterCards.length);
        } while (nextIndex === lastIndex && characterCards.length > 1);

        lastIndex = nextIndex;
        const selected = characterCards[nextIndex];

        document.getElementById("charName").textContent = selected.name;
        document.getElementById("charOrigin").textContent = selected.origin;
        document.getElementById("charDesc").textContent = selected.desc;

        const rulesList = document.getElementById("rulesList");
        rulesList.innerHTML = selected.rules
          .map((r, i) => `<li><span class="num">${i + 1}.</span><span>${r}</span></li>`)
          .join("");

        cardEl.classList.remove("animating");
      }, 150);
    }

    document.getElementById("drawBtn").addEventListener("click", drawCard);
  </script>
</body>
</html>
